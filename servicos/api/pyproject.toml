[project]
name = "mvr-api"
version = "0.1.0"
description = "API do Mapa Vivo de Risco: cadastro de famílias, lista de visitas e contatos por polígono"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.6", "uvicorn[standard]==0.32.1", "psycopg[binary]==3.2.9", "pydantic==2.10.3", "httpx==0.28.1"]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "httpx==0.28.1", "ruff==0.8.4"]

[tool.ruff]
line-length = 120
target-version = "py312"
