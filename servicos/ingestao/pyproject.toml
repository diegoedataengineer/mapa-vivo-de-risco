[project]
name = "mvr-ingestao"
version = "0.1.0"
description = "Ingestão das bases públicas do Mapa Vivo de Risco: baixa, confere e versiona no S3 (roda como tarefas do Airflow existente)"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "boto3==1.40.30"]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4"]

[tool.ruff]
line-length = 120
target-version = "py312"
