a no envio</text><rect x='12' y='264' width='362' height='154' rx='9' fill='#f8fafc' stroke='#cbd5e1' stroke-dasharray='5 3'/><text x='24' y='284' font-size='11' font-weight='700' fill='#1e4e8c' text-anchor='start'>INTEGRAÇÃO</text><rect x='24' y='296' width='338' height='52' rx='6' fill='#ffffff' stroke='#cbd5e1'/><text x='34' y='314' font-size='11.5' font-weight='600' fill='#0f172a' text-anchor='start'>Amazon EventBridge</text><text x='352' y='314' font-size='10' font-weight='500' fill='#1e4e8c' text-anchor='end'>eventos</text><text x='34' y='333' font-size='10' font-weight='400' fill='#475569' text-anchor='start'>imagem nova no S3 submete o job; falha vira alarme</text><rect x='24' y='356' width='338' height='52' rx='6' fill='#ffffff' stroke='#cbd5e1'/><text x='34' y='374' font-size='11.5' font-weight='600' fill='#0f172a' text-anchor='start'>Airflow 3 (VPS da empresa)</text><text x='352' y='374' font-size='10' font-weight='500' fill='#1e4e8c' text-anchor='end'>ingestão</text><text x='34' y='393' font-size='10' font-weight='400' fill='#475569' text-anchor='start'>reaproveita agenda, retentativas e histórico existentes</text><rect x='386' y='264' width='362' height='154' rx='9' fill='#f8fafc' stroke='#cbd5e1' stroke-dasharray='5 3'/><text x='398' y='284' font-size='11' font-weight='700' fill='#1e4e8c' text-anchor='start'>OPERAÇÃO E SEGURANÇA</text><rect x='398' y='296' width='338' height='52' rx='6' fill='#ffffff' stroke='#cbd5e1'/><text x='408' y='314' font-size='11.5' font-weight='600' fill='#0f172a' text-anchor='start'>CloudWatch + SNS</text><text x='726' y='314' font-size='10' font-weight='500' fill='#1e4e8c' text-anchor='end'>monitoramento</text><text x='408' y='333' font-size='10' font-weight='400' fill='#475569' text-anchor='start'>logs, métricas e alarmes por e-mail</text><rect x='398' y='356' width='338' height='52' rx='6' fill='#ffffff' stroke='#cbd5e1'/><text x='408' y='374' font-size='11.5' font-weight='600' fill='#0f172a' text-anchor='start'>Secrets Manager · IAM · CloudTrail</text><text x='726' y='374' font-size='10' font-weight='500' fill='#1e4e8c' text-anchor='end'>segurança</text><text x='408' y='393' font-size='10' font-weight='400' fill='#475569' text-anchor='start'>segredo fora do código; role mínima; auditoria</text><rect x='12' y='432' width='736' height='34' rx='7' fill='#e8eef7' stroke='#1e4e8c'/><text x='380.0' y='453' font-size='11' font-weight='600' fill='#0f172a' text-anchor='middle'>Tudo em Docker e descrito em Terraform: dev e prod com o mesmo código e um tfvars por ambiente</text></svg>