<svg viewBox='0 0 760 478' width='100%' role='img' aria-label='Onde cada parte roda na AWS, e por quê' style='font-family:"IBM Plex Sans",sans-serif'><defs><marker id='seta' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#94a3b8'/></marker><marker id='seta-v' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#b91c1c'/></marker><marker id='seta-a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#1e4e8c'/></marker></defs><text x='12' y='22' font-size='13.5' font-weight='700' fill='#0f172a' text-anchor='start'>Onde cada parte roda na AWS, e por quê</text><rect x='12' y='36' width='362' height='214' rx='9' fill='#f8fafc' stroke='#cbd5e1' stroke-dasharray='5 3'/><text x='24' y='56' font-size='11' font-weight='700' fill='#1e4e8c' text-anchor='start'>EXECUÇÃO</text><rect x='24' y='68' width='338' height='52' rx='6' fill='#ffffff' stroke='#cbd5e1'/><text x='34' y='86' font-size='11.5' font-weight='600' fill='#0f172a' text-anchor='start'>ECS Fargate (ARM) + ALB</text><text x='352' y='86' font-size='10' font-weight='500' fill='#1e4e8c' text-anchor='end'>API do cadastro</text><text x='34' y='105' font-size='10' font-weight='400' fill='#475569' text-anchor='start'>contêiner sem servidor; autoescala por CPU; health check</text><rect x='24' y='128' width='338' height='52' rx='6' fill='#ffffff' stroke='#cbd5e1'/><text x='34' y='146' font-size='11.5' font-weight='600' fill='#0f172a' text-anchor='start'>AWS Batch · EC2 Spot com GPU</text><text x='352' y='146' font-size='10' font-weight='500' fill='#1e4e8c' text-anchor='end'>detecção</text><text x='34' y='165' font-size='10' font-weight='400' fill='#475569' text-anchor='start'>paga só os minutos de inferência; retentativa na fila</text><rect x='24' y='188' width='338' height='52' rx='6' fil