# Em PR que mexe na infra, roda o plan de dev e publica o resultado como comentário: a revisão de código vê o que
# mudaria na nuvem antes do merge. Só leitura: nunca aplica.
name: terraform-plan
on:
  pull_request:
    paths: ["infra/terraform/**"]
jobs:
  plan-dev:
    if: vars.DEPLOY_ATIVO == 'true'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: infra/terraform/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform init -input=false -backend-config=backend.hcl
      - id: plan
        run: terraform plan -input=false -no-color -var "tag=sha-${GITHUB_SHA::7}" | tail -60 > plano.txt
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plano = fs.readFileSync('infra/terraform/envs/dev/plano.txt', 'utf8');
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number,
              body: '### terraform plan (dev)\n```\n' + plano + '\n```' });
